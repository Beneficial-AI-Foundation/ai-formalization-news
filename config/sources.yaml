# Sources and keywords for the BAIF news page.
#
# Each source has:
#   kind     which fetcher reads it: feed (any RSS or Atom), arxiv, arxiv_rss,
#            github_releases, hackernews, hf_papers, zulip
#   type     tag shown on the page: paper, lean, news, blog, social
#   enabled  true or false
#   filter   none (keep every item) or keywords (keep only items that match a keyword)
#   every    how often to fetch: 1h, 6h, or daily (first run after 01:00 US Eastern each day)
#   max_age_days  optional: ignore items published longer ago than this (default 30)
#   trusted  optional: true for sources that are on topic by design; with Claude on, their
#            items get a summary but are never dropped as not relevant (default false)
#   note     free text for maintainers
#
# To add a blog, copy one of the feed entries, give it a new id, and set its url.
# Switch a source on or off with enabled. Nothing else in the code needs to change.

site:
  title: AI and formalization news
  url: https://beneficial-ai-foundation.github.io/ai-formalization-news/
  repository: https://github.com/Beneficial-AI-Foundation/ai-formalization-news

# Used by the keyword filter and by the Hacker News search.
# Matching ignores case, allows one space or hyphen between words, or none
# ("Lean 4" also matches "Lean4" and "Lean-4"), allows plural endings, and treats
# "isation" as "ization".
keywords:
  - Lean 4
  - Mathlib
  - autoformalization
  - formal verification
  - theorem prover
  - theorem proving
  - proof assistant
  - Isabelle
  - Coq
  - Rocq
  - Dafny
  - Verus
  - ACL2
  - seL4
  - verified code
  - AI mathematics

claude:
  # The CLAUDE_MODEL environment variable overrides this.
  model: claude-haiku-5-5
  effort: low
  max_items_per_run: 100
  max_tokens: 16000
  # Items that Claude could not judge (API error, or more than max_items_per_run
  # waiting) are retried on later runs while they are younger than this.
  retry_days: 3

sources:
  # ---------- Core sources ----------
  - id: arxiv-api
    name: arXiv
    kind: arxiv
    type: paper
    enabled: true
    filter: none
    every: daily
    timeout: 60
    query: >-
      (cat:cs.LO OR cat:cs.PL OR cat:cs.AI OR cat:cs.LG OR cat:cs.SE OR cat:math.LO)
      AND (abs:"Lean 4" OR abs:Mathlib OR abs:autoformalization OR abs:"formal verification"
      OR abs:"theorem proving" OR abs:"proof assistant" OR abs:Isabelle OR abs:Coq
      OR abs:Rocq OR abs:ACL2 OR abs:Dafny OR abs:Verus)
    note: The query already filters by abstract, so no keyword filter. The API can be slow, so it gets a 60 second timeout.

  - id: arxiv-rss
    name: arXiv cs.LO and cs.PL
    kind: arxiv_rss
    type: paper
    url: https://rss.arxiv.org/rss/cs.LO+cs.PL
    enabled: true
    filter: keywords
    every: daily
    note: Only new and cross-listed papers; replacements of older papers are skipped.

  - id: lean-blog
    name: Lean community blog
    kind: feed
    type: lean
    url: https://leanprover-community.github.io/blog/rss.xml
    enabled: true
    filter: none
    trusted: true
    every: 6h

  - id: lean4-releases
    name: Lean 4 releases
    kind: github_releases
    type: lean
    repo: leanprover/lean4
    label: Lean 4
    enabled: true
    filter: none
    trusted: true
    every: 1h

  - id: hackernews
    name: Hacker News
    kind: hackernews
    type: news
    enabled: true
    filter: keywords
    every: 1h
    min_points: 5
    lookback_hours: 48
    note: Searches each keyword; keeps stories whose title or link matches a keyword and that have at least min_points.

  - id: lean-zulip
    name: Lean Zulip announcements
    kind: zulip
    type: lean
    site: https://leanprover.zulipchat.com
    channel: announce
    enabled: false
    filter: none
    trusted: true
    every: 1h
    note: Needs ZULIP_EMAIL and ZULIP_API_KEY, and the Lean community's agreement to a bot reading announcements.

  # Extra blogs: add RSS or Atom links here, for example

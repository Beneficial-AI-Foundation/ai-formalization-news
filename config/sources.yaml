  # New Lean repositories of AI labs and AI-for-mathematics companies. Many publish each result
  # as its own repository (AxiomMath, Google DeepMind). Organizations with at least one Lean
  # repository on 24 Nov 2026; add more to orgs as they appear.
  - id: lab-lean-repos
    name: New Lean repositories of AI labs (GitHub)
    kind: github_repos
    type: paper
    orgs: [anthropics, openai, google-deepmind, facebookresearch, microsoft, mistralai, MoonshotAI,
           ByteDance-Seed, AxiomMath, math-inc, harmonic-ai, project-numina]
    language: Lean
    watch_start: 2026-11-24
    enabled: true
    filter: none
    every: 1h
    note: >-
      About 16 new repositories a month (12 of them AxiomMath's in the month to 24 Nov 2026).
      GitHub does not say when a repository became public. Repositories created before
      watch_start (the day this source was switched on) are dated by their creation. After
      that, one found more than 2 days after its creation (it was private until then) is dated
      by the run that finds it. Untrusted, so Claude hides tooling repositories.


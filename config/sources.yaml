    every: 6h
    note: Formal methods group at TU Wien (Vampire, SAT and SMT, model checking). Group news and seminar talks. No keyword filter, because talk titles rarely contain the keywords; untrusted, so Claude hides off-topic posts.

  - id: sigil-logic
    name: Sigil Logic
    kind: feed
    type: news
    url: https://sigillogic.com/feed.xml
    enabled: true
    filter: none
    every: 6h
    note: Company working on formal methods for AI and secure hardware. Untrusted, so Claude judges each post.

  # Proof repositories of AI labs. Each new result arrives as a commit, often before any
  # paper or blog post. Untrusted, so Claude hides housekeeping commits (CI, README).
  - id: anthropic-formal-math
    name: Anthropic formal-math (GitHub)
    kind: feed
    type: paper
    url: https://github.com/anthropics/formal-math/commits/main.atom
    enabled: true
    filter: none
    exclude_titles: '^(Merge pull request|Merge branch|Bump )'
    every: 1h
    note: One folder per result, each a paper with its Lean proof (VP != VNP, 3SUM and APSP, the Exponential Time Hypothesis). Merge commits repeat the commit before them, and Bump commits are dependency updates, so both are skipped.

  - id: openai-math
    name: OpenAI math (GitHub)
    kind: feed
    type: paper
    url: https://github.com/openai/math/commits/main.atom
    enabled: true
    filter: none
    exclude_titles: '^(Merge pull request|Merge branch|Bump )'
    every: 1h
    note: OpenAI's manuscripts and Lean formalizations, updated a few times a month.

  # AI lab blogs, keyword-filtered: posts about formal mathematics and verification, not
  # every product or model announcement. Anthropic's site has no feed.

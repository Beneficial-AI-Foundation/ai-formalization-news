# Sources and keywords for the BAIF news page.
#
# Each source has:
#   kind     which fetcher reads it: feed (any RSS or Atom), arxiv, arxiv_rss,
#            github_releases, github_repos, hackernews, hf_papers, zulip
#   type     tag shown on the page: paper, lean, news, blog, social
#   enabled  true or false
#   filter   none (keep every item) or keywords (keep only items that match a keyword)
#   every    how often to fetch: 1h, 6h, or daily (first run after 01:00 US Eastern each day)
#   max_age_days  optional: ignore items published longer ago than this (default 30)
#   trusted  optional: true for sources that are on topic by design; with Claude on, their
#            items get a summary but are never hidden as not relevant (default false)
#   stable_only  optional, github_releases only: true skips pre-releases (release
#            candidates, nightly builds); default false keeps them, marked "(pre-release)"
#   exclude_titles  optional, feed only: a regular expression; entries whose title
#            matches it anywhere, ignoring case, are skipped (for example merge commits)
#   channels, min_messages, min_people, lookback_hours, messages  zulip only: which
#            channels to read; keep only topics that started within lookback_hours and have
#            at least min_messages messages from min_people people (default 1 and 1); read
#            the newest `messages` messages of each channel (default 1000)
#   orgs, language, search_days, watch_start  github_repos only: new repositories of
#            these GitHub organizations in this language, created within search_days
#            (default 120); see the source's entry for watch_start
#   note     free text for maintainers
#
# To add a blog, copy one of the feed entries, give it a new id, and set its url.
# Switch a source on or off with enabled. Nothing else in the code needs to change.

site:
  title: AI and formalization news
  url: https://beneficial-ai-foundation.github.io/ai-formalization-news/
  repository: https://github.com/Beneficial-AI-Foundation/ai-formalization-news

# Used by the keyword filter and by the Hacker News search.
# Matching ignores case, allows one space or hyphen between words, or none
# ("Lean 4" also matches "Lean4" and "Lean-4"), allows plural endings, and treats
# "isation" as "ization".
keywords:
  - Lean 4
  - Mathlib
  - autoformalization
  - formal verification
  - theorem prover
  - theorem proving
  - proof assistant
  - Isabelle
  - Coq
  - Rocq
  - Dafny
  - Verus
  - ACL2
  - Agda
  - HOL4
  - HOL Light
  - Metamath
  - Mizar
  - seL4
  - verified code
  - AI mathematics
  - formal math
  - formal mathematics
  - formal proof
  - Lean proof
  - Lean formalization
  - proofs in Lean
  - formalized in Lean
  - machine-checked
  - AlphaProof

claude:
  # The CLAUDE_MODEL environment variable overrides this.
  model: claude-haiku-5-5
  effort: low
  max_items_per_run: 100
  max_tokens: 16000
  # Items that Claude could not judge (API error, or more than max_items_per_run
  # waiting) are retried on later runs while they are younger than this.
  retry_days: 3

sources:
  # ---------- Core sources ----------
  - id: arxiv-api
    name: arXiv
    kind: arxiv
    type: paper
    enabled: true
    filter: none
    every: daily
    timeout: 60
    query: >-
      (cat:cs.LO OR cat:cs.PL OR cat:cs.AI OR cat:cs.LG OR cat:cs.SE OR cat:math.LO)
      AND (abs:"Lean 4" OR abs:Mathlib OR abs:autoformalization OR abs:"formal verification"
      OR abs:"theorem proving" OR abs:"proof assistant" OR abs:Isabelle OR abs:Coq
      OR abs:Rocq OR abs:ACL2 OR abs:Dafny OR abs:Verus OR abs:Agda OR abs:HOL4
      OR abs:"HOL Light" OR abs:Metamath OR abs:Mizar)
    note: The query already filters by abstract, so no keyword filter. The API can be slow, so it gets a 60 second timeout.

  - id: arxiv-rss
    name: arXiv cs.LO and cs.PL
    kind: arxiv_rss
    type: paper
    url: https://rss.arxiv.org/rss/cs.LO+cs.PL
    enabled: true
    filter: keywords
    every: daily
    note: Only new and cross-listed papers; replacements of older papers are skipped.

  - id: lean-blog
    name: Lean community blog
    kind: feed
    type: lean
    url: https://leanprover-community.github.io/blog/rss.xml
    enabled: true
    filter: none
    trusted: true
    every: 6h

  - id: lean4-releases
    name: Lean 4 releases
    kind: github_releases
    type: lean
    repo: leanprover/lean4
    label: Lean 4
    enabled: true
    filter: none
    trusted: true
    every: 1h

  - id: hackernews
    name: Hacker News
    kind: hackernews
    type: news
    enabled: true
    filter: keywords
    every: 1h
    min_points: 5
    lookback_hours: 48
    note: Searches each keyword; keeps stories whose title or link matches a keyword and that have at least min_points.

  # The Lean Zulip, read by the "BAIF news reader" bot (secrets ZULIP_EMAIL and
  # ZULIP_API_KEY). Every channel below is web-public: anyone can read it without an account.
  - id: lean-zulip
    name: Lean Zulip announcements
    kind: zulip
    type: lean
    site: https://leanprover.zulipchat.com
    channels: [General announcements, Project announcements]
    messages: 100
    lookback_hours: 720
    enabled: true
    filter: none
    trusted: true
    every: 1h
    note: Moderated, low-traffic channels (together about one new topic every two or three days), so every new topic counts.

  - id: lean-zulip-discussions
    name: Lean Zulip discussions
    kind: zulip
    type: news
    site: https://leanprover.zulipchat.com
    channels: [general, AI authored projects, Autoformalization, Machine Learning for Theorem Proving]
    min_messages: 10
    min_people: 5
    lookback_hours: 48
    enabled: true
    filter: none
    every: 1h
    note: Busy new topics only. Measured over 10 to 24 Nov 2026, these thresholds kept about one topic a day, among them "VNP != VP in Lean" (19 messages from 10 people on its first day). Untrusted, so Claude hides questions and other off-topic threads.

